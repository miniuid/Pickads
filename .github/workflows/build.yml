name: Build PickAds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'
      - name: Build Windows executable
        run: dotnet build PickAds.csproj -c Release -o dist
      - name: Check resizable Windows layout
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $compiler /nologo /target:exe /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /out:dist/ResizeLayoutChecks.exe tests/ResizeLayoutChecks.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/ResizeLayoutChecks.exe dist/PickAds.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calculate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PickAds.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PickAds.exe" | Set-Content -Encoding ascii dist/PickAds.exe.sha256
      - name: Upload download
        uses: actions/upload-artifact@v4
        with:
          name: PickAds-Windows
          if-no-files-found: error
          path: |
            dist/PickAds.exe
            dist/PickAds.exe.sha256
            SECURITY-REVIEW.md
