name: Build PickAds Safer Preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'
      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          dotnet build PickAds.csproj -c Release -o dist 2>&1 | Tee-Object test-results/app-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check resizable Windows layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          dotnet build tests/ResizeLayoutChecks.csproj -c Release -o layout-checks 2>&1 | Tee-Object test-results/layout-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\layout-checks\ResizeLayoutChecks.exe "$PWD\dist\PickAds.exe" 2>&1 | Tee-Object test-results/layout-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check hosts helper security
        shell: pwsh
        run: |
          dotnet build tests/HostsSecurityChecks.csproj -c Release -o security-checks 2>&1 | Tee-Object test-results/security-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\security-checks\HostsSecurityChecks.exe "$PWD\dist\PickAds.exe" 2>&1 | Tee-Object test-results/security-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PickAds-Safer-Build-Diagnostics
          if-no-files-found: warn
          path: test-results/
      - name: Calculate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PickAds.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PickAds.exe" | Set-Content -Encoding ascii dist/PickAds.exe.sha256
      - name: Upload download
        uses: actions/upload-artifact@v4
        with:
          name: PickAds-Windows-Safer-Preview
          if-no-files-found: error
          path: |
            dist/PickAds.exe
            dist/PickAds.exe.sha256
            SECURITY-REVIEW.md
            README.md
            LICENSE
