name: Build PickAds Safer Preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.419'
      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          dotnet build PickAds.csproj -c Release -o dist 2>&1 | Tee-Object test-results/app-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check resizable Windows layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          dotnet build tests/ResizeLayoutChecks.csproj -c Release -o layout-checks 2>&1 | Tee-Object test-results/layout-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\layout-checks\ResizeLayoutChecks.exe "$PWD\dist\PickAds.exe" 2>&1 | Tee-Object test-results/layout-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check hosts helper security
        shell: pwsh
        run: |
          dotnet build tests/HostsSecurityChecks.csproj -c Release -o security-checks 2>&1 | Tee-Object test-results/security-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\security-checks\HostsSecurityChecks.exe "$PWD\dist\PickAds.exe" 2>&1 | Tee-Object test-results/security-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PickAds-Safer-Build-Diagnostics
          if-no-files-found: warn
          path: test-results/
      - name: Calculate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PickAds.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PickAds.exe" | Set-Content -Encoding ascii dist/PickAds.exe.sha256
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "PickAds-release-package"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item dist/PickAds.exe, dist/PickAds.exe.sha256, README.md, SECURITY-REVIEW.md, LICENSE -Destination $package
          Compress-Archive -LiteralPath (Get-ChildItem -File $package).FullName -DestinationPath dist/PickAds-Windows-Safer-Preview.zip -Force
      - name: Upload download
        uses: actions/upload-artifact@v4
        with:
          name: PickAds-Windows-Safer-Preview
          if-no-files-found: error
          path: |
            dist/PickAds.exe
            dist/PickAds.exe.sha256
            dist/PickAds-Windows-Safer-Preview.zip
            SECURITY-REVIEW.md
            README.md
            LICENSE
            RELEASE-NOTES.md

  publish:
    if: github.ref == 'refs/tags/v1.2.0-beta.1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PickAds-Windows-Safer-Preview
          path: release-assets
      - name: Create draft and upload verified build assets
        env:
          GH_TOKEN: ${{ github.token }}
          PICKADS_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$PICKADS_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "PickAds 1.2.0 Beta 1 — Safer Preview" \
            --notes-file release-assets/RELEASE-NOTES.md \
            release-assets/dist/PickAds.exe \
            release-assets/dist/PickAds.exe.sha256 \
            release-assets/dist/PickAds-Windows-Safer-Preview.zip
      - name: Publish the completed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PICKADS_TAG: ${{ github.ref_name }}
        run: gh release edit "$PICKADS_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

  release-status:
    if: always() && (github.ref == 'refs/tags/v1.2.0-beta.1' || github.ref == 'refs/heads/pickads-windows-safer')
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.build.result != 'success'
        continue-on-error: true
        with:
          name: PickAds-Safer-Build-Diagnostics
          path: release-diagnostics
      - name: Verify the release and record its status
        env:
          GH_TOKEN: ${{ github.token }}
          PICKADS_BUILD_RESULT: ${{ needs.build.result }}
          PICKADS_PUBLISH_RESULT: ${{ needs.publish.result }}
        run: python3 .github/scripts/release_status.py
